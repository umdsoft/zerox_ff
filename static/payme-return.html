<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ZeroX — ilovaga qaytish</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f1f5f9; color: #1e293b; }
    .card { background: #fff; border-radius: 20px; padding: 32px 24px; max-width: 360px; width: calc(100% - 32px);
      text-align: center; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
    a.btn { display: block; margin-top: 20px; padding: 14px; border-radius: 12px; background: #2563eb; color: #fff;
      text-decoration: none; font-weight: 600; }
    p { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="font-size:20px;margin:0 0 8px">To'lov qabul qilindi</h1>
    <p>Natijani ko'rish uchun ZeroX ilovasiga qayting.</p>
    <a class="btn" id="open" href="zeroxuz://UserMoneyResult">Ilovaga qaytish</a>
  </div>
  <script>
    // Payme to'lovidan keyin ilovaga qaytarish (parametrlar UZATILMAYDI — ilova natijani serverdan oladi).
    (function () {
      var appUrl = 'zeroxuz://UserMoneyResult';
      var isAndroid = /android/i.test(navigator.userAgent);
      window.location.href = appUrl;
      if (isAndroid) {
        setTimeout(function () {
          if (document.visibilityState === 'visible') {
            window.location.href = 'https://play.google.com/store/apps/details?id=com.zeroxuz';
          }
        }, 1500);
      }
    })();
  </script>
</body>
</html>
