name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# VULN-L13 (2026-09-11): least-privilege — test/build uchun yozuv kerak emas.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      # Reproducible install from the committed yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Production build
        run: yarn generate
      # SCA report — gate on Critical/High once the EOL platform is migrated (VULN-008).
      - name: Dependency audit
        run: yarn npm audit --severity high || true
